name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore HlslParser.slnx

      - name: Build (Release)
        run: dotnet build HlslParser.slnx -c Release --no-restore

      - name: Test (Release)
        run: dotnet test HlslParser.slnx -c Release --no-build --verbosity normal
